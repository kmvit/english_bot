services:
  bot:
    build: .
    container_name: english-bot
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
      HF_HOME: /app/data/models
      PIPER_MODEL_DIR: /app/data/voices
      KOKORO_MODEL_DIR: /app/data/kokoro
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Whisper на пике съедает ~900 МБ, Piper ещё ~220 МБ. Лимит защищает
    # соседей по серверу от того, чтобы бот утянул всю память при сбое.
    mem_limit: 2g
    # Бот делит машину с VPN: распознавание занимает оба ядра на десятки
    # секунд, и без ограничений в это время просядет весь VPN-трафик.
    # cpus оставляет пол-ядра всегда свободным, cpu_shares отдаёт процессор
    # соседям при конкуренции — бот считает медленнее, но никого не душит.
    cpus: 1.5
    cpu_shares: 512
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
